<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home</title>
    <link rel="stylesheet" href="studentcode.css">
</head>
<body>
    <!-- start whole -->
    <div class="student-home-whole">


        <!-- start header -->
        <header class="student-home-main-header">
            <!--magbibigay ulit ako nyan, pero ito lng ang magbabago-->
        </header>
        <!-- end header -->



        <!-- start code container -->
        <div class="student-home-code-container">
            <div class="student-home-welcome-label">Welcome, Yla Marino</div> <!-- kaya ba to? makukuha name ng student-->
            <div class="student-home-input">
                <label for="section">Section</label>
                <input type="text" id="section" placeholder="Enter your section">
            </div>
            <div class="student-home-input">
                <label for="code">Code</label>
                <input type="text" id="code" placeholder="Enter your exam code">
            </div>
            <button class="student-home-exam-button">Take Exam</button>
        </div>
        <!--end code container-->



    </div>
    <!-- end whole student home-->
</body>
</html>
